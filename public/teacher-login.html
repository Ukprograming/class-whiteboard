<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <title>教員ログイン | Class Whiteboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="./style.css?v=login-flow-20260824&amp;password-visibility=20260825" rel="stylesheet" />
</head>

<body class="app-root login-page">
  <main class="login-container teacher-login-card">
    <p class="login-product-name">Class Whiteboard</p>
    <h1>教員ログイン</h1>
    <p class="login-page-description">登録済みの教員アカウントでログインします。</p>
    <form method="POST" action="./teacher-login.html" data-teacher-login-form>
      <label>
        教員メール
        <input id="teacherEmail" type="email" name="email" autocomplete="username" required />
      </label>
      <label>
        パスワード
        <span class="password-input-wrap">
          <input id="teacherPassword" type="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
          <button class="password-visibility-button" type="button" data-password-visibility aria-controls="teacherPassword" aria-label="パスワードを表示" aria-pressed="false">
            <svg class="password-visibility-icon password-visibility-icon-show" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M2.1 12s3.6-7 9.9-7 9.9 7 9.9 7-3.6 7-9.9 7-9.9-7-9.9-7Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg class="password-visibility-icon password-visibility-icon-hide" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="m3 3 18 18" />
              <path d="M10.6 5.2A10.9 10.9 0 0 1 12 5c6.3 0 9.9 7 9.9 7a15.4 15.4 0 0 1-2.1 3" />
              <path d="M6.6 6.6A16.8 16.8 0 0 0 2.1 12s3.6 7 9.9 7a9.8 9.8 0 0 0 4.1-.9" />
              <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8" />
            </svg>
          </button>
        </span>
      </label>
      <label>
        担当クラス
        <select id="teacherClassSelect" name="classCode">
          <option value="">ログイン後にクラスを作成・選択</option>
        </select>
      </label>
      <p id="teacherClassHelp" class="login-field-help">この端末で作成・取得したクラスが表示されます。</p>
      <button type="submit">ログイン</button>
      <a class="login-secondary-action login-secondary-link" href="./teacher-signup.html">初回の教員アカウント作成</a>
      <p id="teacherLoginMessage" class="login-message" aria-live="polite"></p>
    </form>
  </main>
  <script src="./js/app-config.js"></script>
  <script src="./js/local-config-loader.js"></script>
  <script src="./js/password-visibility.js?v=20260825"></script>
  <script type="module" src="./js/teacher-login.js?v=login-flow-20260824&amp;realtime-duplex=20260824&amp;auth-load=20260905"></script>
</body>

</html>
