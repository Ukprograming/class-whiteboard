<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <title>教員アカウント作成 | Class Whiteboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="./style.css?v=login-flow-20260824&amp;security-reliability=20260912&amp;production-fixes=20260915&amp;draft-recovery=20260915&amp;stamp-refresh=20260924" rel="stylesheet" />
  <link href="./clear-blue.css?v=20260917" rel="stylesheet" />
  <script type="module" src="./js/clear-blue-ui.js?v=20260917"></script>
</head>

<body class="app-root login-page">
  <main class="login-container teacher-login-card">
    <p class="login-product-name">Class Whiteboard</p>
    <h1>教員アカウント作成</h1>
    <p class="login-page-description">初回登録時のみ、教員用招待コードが必要です。</p>
    <form data-teacher-signup-form>
      <label>
        表示名
        <input id="teacherDisplayName" type="text" name="displayName" autocomplete="name" required />
      </label>
      <label>
        教員メール
        <input id="teacherEmail" type="email" name="email" autocomplete="username" required />
      </label>
      <label>
        パスワード
        <span class="password-input-wrap">
          <input id="teacherPassword" type="password" name="password" placeholder="8文字以上" autocomplete="new-password" minlength="8" required />
          <button class="password-visibility-button" type="button" data-password-visibility aria-controls="teacherPassword" aria-label="パスワードを表示" aria-pressed="false">
            <svg class="password-visibility-icon password-visibility-icon-show" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M2.1 12s3.6-7 9.9-7 9.9 7 9.9 7-3.6 7-9.9 7-9.9-7-9.9-7Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg class="password-visibility-icon password-visibility-icon-hide" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="m3 3 18 18" />
              <path d="M10.6 5.2A10.9 10.9 0 0 1 12 5c6.3 0 9.9 7 9.9 7a15.4 15.4 0 0 1-2.1 3" />
              <path d="M6.6 6.6A16.8 16.8 0 0 0 2.1 12s3.6 7 9.9 7a9.8 9.8 0 0 0 4.1-.9" />
              <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8" />
            </svg>
          </button>
        </span>
      </label>
      <label>
        教員用招待コード
        <span class="password-input-wrap">
          <input id="teacherInviteCode" type="password" name="inviteCode" autocomplete="off" required />
          <button class="password-visibility-button" type="button" data-password-visibility data-password-visibility-label="教員用招待コード" aria-controls="teacherInviteCode" aria-label="教員用招待コードを表示" aria-pressed="false">
            <svg class="password-visibility-icon password-visibility-icon-show" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M2.1 12s3.6-7 9.9-7 9.9 7 9.9 7-3.6 7-9.9 7-9.9-7-9.9-7Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg class="password-visibility-icon password-visibility-icon-hide" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="m3 3 18 18" />
              <path d="M10.6 5.2A10.9 10.9 0 0 1 12 5c6.3 0 9.9 7 9.9 7a15.4 15.4 0 0 1-2.1 3" />
              <path d="M6.6 6.6A16.8 16.8 0 0 0 2.1 12s3.6 7 9.9 7a9.8 9.8 0 0 0 4.1-.9" />
              <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8" />
            </svg>
          </button>
        </span>
      </label>
      <button type="submit">アカウントを作成</button>
      <a class="login-secondary-action login-secondary-link" href="./teacher-login.html">通常ログインに戻る</a>
      <p id="teacherSignupMessage" class="login-message" aria-live="polite"></p>
    </form>
  </main>
  <script src="./js/app-config.js"></script>
  <script src="./js/local-config-loader.js"></script>
  <script src="./js/password-visibility.js?v=20260825&amp;signup-visibility=20260930"></script>
  <script type="module" src="./js/teacher-signup.js?v=teacher-auth-split-20260712&amp;realtime-duplex=20260824&amp;auth-load=20260905&amp;media-upload=20260911&amp;security-reliability=20260912&amp;production-fixes=20260915&amp;draft-recovery=20260915"></script>
</body>

</html>
