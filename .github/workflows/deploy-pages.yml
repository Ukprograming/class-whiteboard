name: Deploy staging frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "scripts/**"
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/backend-release.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run all regression tests
        run: npm test

      - name: Check frontend/backend release order
        run: node scripts/release-preflight.mjs --check

      - name: Build Pages artifact and release manifest
        run: |
          cp -R public dist-pages
          node scripts/build-release-manifest.mjs --output dist-pages/release-manifest.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static frontend
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
